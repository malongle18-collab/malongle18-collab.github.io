<!DOCTYPE html>
<html lang="zh-HK">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#194350" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#10262C" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="僱傭助手">
    <meta name="application-name" content="外傭僱傭助手">
    <meta name="description" content="香港外傭與僱主共用的本機規劃工具：合約、假期、工作安排、工作守則、買餸清單與薪金估算。資料只存在你的裝置上。">
    <meta name="format-detection" content="telephone=no">
    <title>外傭僱傭助手</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <link rel="stylesheet" href="./css/app.css?v=5">
  </head>
  <body>
    <div id="app">
      <p id="boot-msg" style="margin:0;padding:2rem 1.2rem;font-family:system-ui,sans-serif;color:#194350;background:#f3f6f6;min-height:100vh;box-sizing:border-box;">載入中…</p>
      <noscript>請開啟 JavaScript 以使用外傭僱傭助手。</noscript>
    </div>
    <script type="module" src="./js/app.js?v=5"></script>
    <script>
      window.addEventListener("load", function () {
        setTimeout(function () {
          var el = document.getElementById("boot-msg");
          if (el) {
            el.textContent = "載入唔到。請用無痕視窗開啟呢個網站，或喺瀏覽器清除此網站的資料後再試。";
          }
        }, 4000);
      });
    </script>
  </body>
</html>
